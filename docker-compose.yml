services:
  postgres:
    image: postgres:16-alpine
    container_name: audio_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-audio_db}
      POSTGRES_USER: ${DB_USER:-audio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-audio_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-audio_user} -d ${DB_NAME:-audio_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
